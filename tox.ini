[tox]
envlist=
    core
    lint
    deps
    cve

[testenv]
passenv=
    PYTEST_ADDOPTS
default_base_python=
    3.14

[common-install]
deps=
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements_test.txt

[common-core]
deps={[common-install]deps}
commands=
    pytest {posargs:tests}

[common-lint]
deps={[common-install]deps}
commands=
    ruff check {toxinidir}/ethstaker_deposit {toxinidir}/tests
    mypy --config-file {toxinidir}/mypy.ini -p ethstaker_deposit

[testenv:core]
deps={[common-core]deps}
setenv=
    PYTHONWARNINGS=error::DeprecationWarning,error::PendingDeprecationWarning
commands={[common-core]commands}

[testenv:lint]
deps={[common-lint]deps}
commands={[common-lint]commands}

[testenv:deps]
deps=
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements_test.txt
commands=
    python {toxinidir}/scripts/check_dependencies_sync.py

[testenv:cve]
deps={[common-install]deps}
commands=
    pip-audit -r {toxinidir}/requirements.txt -r {toxinidir}/requirements_test.txt --no-deps --strict --desc

[testenv:binary-test]
# Runs the interactive release-asset suite (binary_tests/run_tests.sh, expect)
# and the non-interactive test (binary_tests/test_non_interactive.sh, no expect)
# against a pre-built standalone binary. Not part of the default envlist: the
# binary must exist first, e.g. `make build_linux` / `make build_macos`, which
# produce `./dist`. Point BINARY_TEST_BINARY_DIR at any other build output:
#   tox -e binary-test
#   BINARY_TEST_BINARY_DIR=/path/to/binary-dir tox -e binary-test
skip_install = true
allowlist_externals =
    bash
commands=
    bash {toxinidir}/binary_tests/run_tests.sh {env:BINARY_TEST_BINARY_DIR:dist}
    bash {toxinidir}/binary_tests/test_non_interactive.sh {env:BINARY_TEST_BINARY_DIR:dist}
