name: ci-pypi
run-name: ${{ github.actor }} is publishing ${{ github.ref_name }} to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build packaging

      - name: Verify VERSION file matches tag and pre-release flag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < ethstaker_deposit/VERSION)"
          echo "Tag version:  ${TAG_VERSION}"
          echo "VERSION file: ${FILE_VERSION}"
          if [[ "${FILE_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::ethstaker_deposit/VERSION (${FILE_VERSION}) does not match pushed tag (${TAG_VERSION}). Refusing to publish to PyPI."
            exit 1
          fi

          IS_PRERELEASE="$(python -c "from packaging.version import Version; print(Version('${FILE_VERSION}').is_prerelease)")"
          GH_PRERELEASE="${{ github.event.release.prerelease }}"
          echo "Version is_prerelease: ${IS_PRERELEASE}"
          echo "GitHub release prerelease flag: ${GH_PRERELEASE}"
          if [[ "${IS_PRERELEASE,,}" != "${GH_PRERELEASE}" ]]; then
            echo "::error::ethstaker_deposit/VERSION (${FILE_VERSION}) pre-release status (${IS_PRERELEASE}) does not match this release's 'Set as a pre-release' flag (${GH_PRERELEASE}). Refusing to publish to PyPI."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        # Releases can be found on https://github.com/pypa/gh-action-pypi-publish/releases
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
