[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
version = { file = "ethstaker_deposit/VERSION" }

[tool.pip-tools]
generate-hashes = true
no-annotate = true

[tool.ruff]
preview = true
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[project]
name = "ethstaker_deposit"
description = "Secure key generation for deposits"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.4.2",
    "eth-typing>=6.0.0",
    "eth-utils>=6.0.0",
    "pycryptodome>=3.23.0",
    "pyperclip>=1.11.0",
    "py-ecc>=8.0.0",
    "ssz>=0.5.2",
    "jsonschema>=4.26.0",
    "colorama>=0.4.6 ; sys_platform == 'win32'",
]
requires-python = ">=3.10,<4"
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "exceptiongroup==1.3.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "backports-asyncio-runner==1.2.0 ; python_version < '3.11'",
    "coverage==7.15.4",
    "tomli==2.4.1",
    "iniconfig==2.3.0",
    "mypy-extensions==1.1.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "typing-extensions==4.16.0",
    "ruff==0.16.4",
    "Pygments==2.20.0",
    "pathspec==1.1.1",
    "pip-audit==2.10.1",
]

[project.urls]
Homepage = "https://github.com/ethstaker/ethstaker-deposit-cli"
Issues = "https://github.com/ethstaker/ethstaker-deposit-cli/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]
