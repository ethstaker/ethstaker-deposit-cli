[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
version = { file = "ethstaker_deposit/VERSION" }

[tool.pip-tools]
generate-hashes = true
no-annotate = true

[tool.ruff]
preview = true
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[project]
name = "ethstaker_deposit"
description = "Secure key generation for deposits"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.5.1",
    "eth-typing>=6.0.0",
    "eth-utils>=6.0.0",
    "pycryptodome>=3.23.0",
    "pyperclip>=1.11.0",
    "py-ecc>=8.0.0",
    "ssz>=0.5.2",
    "jsonschema>=4.26.0",
    "colorama>=0.4.6 ; sys_platform == 'win32'",
    # Transitive dependencies, listed so Dependabot updates them in uv.lock.
    # Floors are the highest minimum their parent packages require.
    "annotated-types>=0.6.0",
    "attrs>=22.2.0",
    "cytoolz>=0.10.1 ; implementation_name == 'cpython'",
    "eth-hash>=0.3.1",
    "jsonschema-specifications>=2023.03.6",
    "lru-dict>=1.1.6",
    "pydantic>=2.0.0",
    "pydantic-core>=2.46.5",
    "pyrsistent>=0.16.0",
    "referencing>=0.31.0",
    "rpds-py>=0.25.0",
    "toolz>=0.9.0 ; implementation_name == 'cpython' or implementation_name == 'pypy'",
    "typing-extensions>=4.15.0",
    "typing-inspection>=0.4.2",
]
requires-python = ">=3.11,<4"
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "coverage==7.16.2",
    "ruff==0.16.9",
    "pip-audit==2.10.1",
    # Transitive dependencies, listed so Dependabot updates them in uv.lock,
    # pinned to the locked version. pip (via pip-api) is omitted because it
    # is not exported to requirements_test.txt.
    "ast-serialize==0.11.2",
    "boolean-py==5.0",
    "cachecontrol==0.14.4",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "cyclonedx-python-lib==11.12.0",
    "defusedxml==0.7.1",
    "filelock==4.0.8",
    "idna==3.20",
    "iniconfig==2.3.0",
    "librt==0.16.0 ; platform_python_implementation != 'PyPy'",
    "license-expression==30.4.4",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "msgpack==1.2.3",
    "mypy-extensions==1.1.0",
    "packageurl-python==0.17.6",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pip-api==0.0.35",
    "pip-requirements-parser==32.0.1",
    "platformdirs==4.12.2",
    "pluggy==1.6.0",
    "py-serializable==2.1.0",
    "pygments==2.21.0",
    "pyparsing==3.3.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "sortedcontainers==2.4.0",
    "tomli==2.4.1",
    "tomli-w==1.2.0",
    "urllib3==2.8.0",
]

[project.urls]
Homepage = "https://github.com/ethstaker/ethstaker-deposit-cli"
Issues = "https://github.com/ethstaker/ethstaker-deposit-cli/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]
